[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v4-exit-quote"
version = "0.1.0"
description = "Read-only trace-based withdrawal quotes for Uniswap v4 PositionManager"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
v4-exit-quote = "v4_exit_quote.__main__:main"

[tool.setuptools.packages.find]
include = ["v4_exit_quote*"]
